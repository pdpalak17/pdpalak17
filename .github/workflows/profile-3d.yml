name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D contribution graph
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove fork counter
        run: |
          python3 - << 'PY'
          import glob, re
          pattern = re.compile(
              r'<g[^>]*>\s*<path[^>]*d="M5 3\.25a\.75[^"]*"[^>]*?(?:/>|>\s*</path>)\s*</g>'
              r'\s*<text[^>]*>[^<]*(?:<title>[^<]*</title>)?\s*</text>',
              re.S,
          )
          for f in glob.glob("profile-3d-contrib/*.svg"):
              s = open(f, encoding="utf-8").read()
              new, n = pattern.subn("", s)
              if n:
                  open(f, "w", encoding="utf-8").write(new)
              print(f, "removed" if n else "no match")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Update 3D contribution graph" || exit 0
          git push
